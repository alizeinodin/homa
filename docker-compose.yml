# Cafejoon / production-style deploy for Homa (Twitter clone).
# Expects external Docker network `cafejoon_app` and image `sail-8.3/app-prod`.
# For local development, prefer `php artisan serve` + SQLite (see README).

services:
  homa.app:
    image: sail-8.3/app-prod
    container_name: homa_app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
    volumes:
      - '.:/var/www/html'
    networks:
      - cafejoon_app
    depends_on:
      homa.mysql:
        condition: service_healthy
    entrypoint: start-container
    command: php artisan serve --host=0.0.0.0 --port=80
    restart: unless-stopped

  homa.mysql:
    image: 'mysql/mysql-server:8.0'
    container_name: homa_mysql
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE:-homa}'
      MYSQL_USER: '${DB_USERNAME:-homa}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'homa-mysql:/var/lib/mysql'
    networks:
      - cafejoon_app
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD:-secret}']
      retries: 10
      timeout: 5s
      interval: 5s
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  cafejoon_app:
    external: true

volumes:
  homa-mysql:
    driver: local
